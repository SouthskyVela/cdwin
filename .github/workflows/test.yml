name: test

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 语法检查
        run: |
          bash -n cdwin.sh
          bash -n install.sh
          bash -n tests/run.sh

      - name: 运行测试（可移植子集）
        run: bash tests/run.sh
